<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friendbook - Story Archive</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000032">

    <link rel="stylesheet" href="dashboard.css?v=1787000000032">

    <link rel="stylesheet" href="premium.css?v=1787000000032">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000032">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION -->
    <!-- ========================= -->

    <header class="topbar">


        <div
            class="logo"
            onclick="location.href='index.html'"
            title="Friendbook"
        ></div>



        <div class="search-box">

            <span>
                <i data-lucide="search"></i>
            </span>

            <input
                type="text"
                placeholder="Search Friendbook"
            >

        </div>



        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i data-lucide="house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='watch.html'"
                title="Watch"
            >
                <i data-lucide="tv"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i data-lucide="clapperboard"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='groups.html'"
                title="Groups"
            >
                <i data-lucide="users"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i data-lucide="message-circle"></i>
            </button>

        </nav>



        <div class="top-icons">

            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i data-lucide="message-circle"></i>
            </button>

            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                <i data-lucide="bell"></i>
            </button>

        </div>


    </header>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="story-archive-main">

        <div class="story-archive-head">

            <button
                type="button"
                class="story-archive-back"
                onclick="history.back()"
                title="Back"
            >
                <i data-lucide="arrow-left"></i>
            </button>

            <div>

                <h1>Story archive</h1>

                <p class="story-archive-sub">Your stories, after they expire.</p>

            </div>

        </div>

        <div class="story-archive-filters">

            <button type="button" class="active" data-story-filter="all">
                All
            </button>

            <button type="button" data-story-filter="stories">
                Stories
            </button>

        </div>

        <div class="story-archive-grid" id="storyArchiveGrid">

            <p class="empty-message" style="grid-column:1/-1;">
                Loading story archive...
            </p>

        </div>

    </main>


    <!-- STORY VIEWER -->

    <div class="story-archive-viewer" id="storyArchiveViewer" style="display:none">

        <div class="story-archive-viewer-top">

            <button type="button" class="story-archive-viewer-close" onclick="socialhubStoryArchiveViewerClose()" title="Close">
                <i data-lucide="arrow-left"></i>
            </button>

            <div class="story-archive-viewer-meta">

                <strong id="storyArchiveViewerDate"></strong>

                <span id="storyArchiveViewerViews"></span>

            </div>

            <div class="story-archive-viewer-menu-wrap">

                <button type="button" class="story-archive-viewer-dots" onclick="socialhubStoryArchiveToggleMenu(event)" title="More options">
                    <i data-lucide="ellipsis-vertical"></i>
                </button>

                <div class="story-archive-viewer-menu" id="storyArchiveViewerMenu" style="display:none">

                    <button type="button" onclick="socialhubStoryArchiveSave()">
                        <i data-lucide="download"></i>
                        Save
                    </button>

                    <button type="button" onclick="socialhubStoryArchiveDeleteAsk()">
                        <i data-lucide="trash-2"></i>
                        Delete
                    </button>

                    <button type="button" onclick="socialhubStoryArchiveHighlightOpen()">
                        <i data-lucide="star"></i>
                        Add to highlight
                    </button>

                </div>

            </div>

        </div>

        <div class="story-archive-viewer-stage" id="storyArchiveViewerStage"></div>

    </div>


    <!-- DELETE CONFIRM MODAL -->

    <div class="story-archive-modal" id="storyDeleteModal" style="display:none">

        <div class="story-archive-modal-box">

            <h3>Delete this story?</h3>

            <p>This will permanently delete the story from your archive. This cannot be undone.</p>

            <div class="story-archive-modal-actions">

                <button type="button" class="archive-btn archive-btn-cancel" onclick="socialhubStoryDeleteCancel()">
                    Cancel
                </button>

                <button type="button" class="archive-btn archive-btn-danger" onclick="socialhubStoryDeleteConfirm()">
                    Delete
                </button>

            </div>

        </div>

    </div>


    <!-- ADD TO HIGHLIGHT MODAL -->

    <div class="story-archive-modal" id="storyHighlightModal" style="display:none">

        <div class="story-archive-modal-box">

            <h3>Add to highlight</h3>

            <p>Give your new highlight a name.</p>

            <input
                type="text"
                class="story-highlight-input"
                id="storyHighlightName"
                placeholder="Highlight name"
                maxlength="40"
            />

            <div class="story-archive-modal-actions">

                <button type="button" class="archive-btn archive-btn-cancel" onclick="socialhubStoryHighlightCancel()">
                    Cancel
                </button>

                <button type="button" class="archive-btn archive-btn-primary" onclick="socialhubStoryHighlightCreate()">
                    Create
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <script src="supabase.js?v=1787000000032"></script>

    <script src="premium-ui.js?v=1787000000032"></script>

    <script src="story-archive.js?v=1787000000032"></script>

</body>

</html>
