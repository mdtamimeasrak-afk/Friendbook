<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA - Archive</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000023">

    <link rel="stylesheet" href="dashboard.css?v=1787000000023">

    <link rel="stylesheet" href="premium.css?v=1787000000023">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000023">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION -->
    <!-- ========================= -->

    <header class="topbar">


        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <div class="search-box">

            <span>
                <i data-lucide="search"></i>
            </span>

            <input
                type="text"
                placeholder="Search TRIYA"
            >

        </div>



        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i data-lucide="house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='watch.html'"
                title="Watch"
            >
                <i data-lucide="tv"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i data-lucide="clapperboard"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='groups.html'"
                title="Groups"
            >
                <i data-lucide="users"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i data-lucide="message-circle"></i>
            </button>

        </nav>



        <div class="top-icons">

            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i data-lucide="message-circle"></i>
            </button>

            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                <i data-lucide="bell"></i>
            </button>

        </div>


    </header>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="archive-main">

        <div class="archive-head">

            <button
                type="button"
                class="archive-back"
                onclick="history.back()"
                title="Back"
            >
                <i data-lucide="arrow-left"></i>
            </button>

            <div>

                <h1>Archive</h1>

                <p class="archive-sub">Your archived posts, kept safe.</p>

            </div>

        </div>

        <div class="archive-filters">

            <button type="button" class="active" data-arch-filter="all">
                All
            </button>

            <button type="button" data-arch-filter="posts">
                Posts
            </button>

            <button type="button" data-arch-filter="photos">
                Photos
            </button>

            <button type="button" data-arch-filter="videos">
                Videos
            </button>

        </div>

        <div class="archive-grid" id="archiveGrid">

            <p class="empty-message" style="grid-column:1/-1;">
                Loading archive...
            </p>

        </div>

    </main>


    <!-- DELETE CONFIRM MODAL -->

    <div class="archive-modal" id="archiveDeleteModal" style="display:none">

        <div class="archive-modal-box">

            <h3>Delete this archived item?</h3>

            <p>This will permanently delete the post. This cannot be undone.</p>

            <div class="archive-modal-actions">

                <button type="button" class="archive-btn archive-btn-cancel" onclick="socialhubArchiveConfirmClose()">
                    Cancel
                </button>

                <button type="button" class="archive-btn archive-btn-danger" onclick="socialhubArchiveConfirmDelete()">
                    Delete
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <script src="supabase.js?v=1787000000023"></script>

    <script src="premium-ui.js?v=1787000000023"></script>

    <script src="archive.js?v=1787000000023"></script>

</body>

</html>
