<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - TRIYA</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000006">

    <link rel="stylesheet" href="dashboard.css?v=1787000000006">

    <link rel="stylesheet" href="premium.css?v=1787000000006">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000006">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION (home page style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO (Facebook-style "f") -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search TRIYA"
            >

        </div>



        <!-- CENTER NAV (Facebook tabs) -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="socialhubOpenFriendsModal()"
                title="Friends"
            >
                <i class="fa-solid fa-user-group"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="document.querySelector('.top-icons button[title=&quot;Notifications&quot;]')?.click()"
                title="Notifications"
            >
                <i class="fa-solid fa-bell"></i>
            </button>

        </nav>



        <!-- TOP ICONS (Facebook gray circles) -->

        <div class="top-icons">


            <button
                title="Messages"
            >
                💬
            </button>


            <button
                title="Notifications"
            >
                🔔
            </button>


            <button
                onclick="toggleDarkMode()"
                title="Dark Mode"
            >
                🌙
            </button>


            <button
                onclick="location.href='settings.html'"
                title="Settings"
            >
                ⚙️
            </button>


            <button
                onclick="location.href='profile.html'"
                class="profile-mini side-avatar"
                title="Profile"
            >
                👤
            </button>


        </div>

    </header>



    <!-- ========================= -->
    <!-- SEARCH RESULTS -->
    <!-- ========================= -->

    <main class="search-container">

        <h2
            class="search-title"
            id="searchTitle"
        >
            Search TRIYA
        </h2>

        <div
            class="search-tabs"
            id="searchTabs"
        >

            <button
                class="search-tab active"
                data-tab="all"
                onclick="socialhubSearchSetTab('all')"
            >
                <i class="fa-solid fa-layer-group"></i>
                All
            </button>

            <button
                class="search-tab"
                data-tab="people"
                onclick="socialhubSearchSetTab('people')"
            >
                <i class="fa-solid fa-user-group"></i>
                People
            </button>

            <button
                class="search-tab"
                data-tab="posts"
                onclick="socialhubSearchSetTab('posts')"
            >
                <i class="fa-solid fa-newspaper"></i>
                Posts
            </button>

        </div>

        <div
            class="search-results"
            id="searchResults"
        ></div>

    </main>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1787000000006"></script>

    <script src="premium-ui.js?v=1787000000006"></script>

    <script src="script.js?v=1787000000006"></script>

    <script src="settings.js?v=1787000000006"></script>

    <script src="friends.js?v=1787000000006"></script>

    <script src="user-search.js?v=1787000000006"></script>

    <script src="notifications.js?v=1787000000006"></script>

    <script src="messages.js?v=1787000000006"></script>


</body>

</html>
