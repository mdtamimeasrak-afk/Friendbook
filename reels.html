<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA - Reels</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1786741716218">

    <link rel="stylesheet" href="dashboard.css?v=1786741716218">

    <link rel="stylesheet" href="premium.css?v=1786741716218">

    <link rel="stylesheet" href="reels.css?v=1786741716218">

    <link rel="stylesheet" href="glass-theme.css?v=1786741716218">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION (home page style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO (Facebook-style "f") -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search TRIYA"
            >

        </div>



        <!-- CENTER NAV (Facebook tabs) -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Friends"
            >
                <i class="fa-solid fa-user-group"></i>
            </button>


            <button
                class="fb-nav-btn active"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Notifications"
            >
                <i class="fa-solid fa-bell"></i>
            </button>

        </nav>



        <!-- TOP ICONS (Facebook gray circles) -->

        <div class="top-icons">


            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                💬
            </button>


            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                🔔
            </button>


            <button
                onclick="toggleDarkMode()"
                title="Dark Mode"
            >
                🌙
            </button>


            <button
                onclick="location.href='settings.html'"
                title="Settings"
            >
                ⚙️
            </button>


            <button
                onclick="location.href='profile.html'"
                class="profile-mini side-avatar"
                title="Profile"
            >
                👤
            </button>


        </div>

    </header>



    <!-- ========================= -->
    <!-- REELS VIEWPORT -->
    <!-- ========================= -->

    <main class="reels-viewport" id="reelsViewport">

        <section class="reels-feed" id="reelsFeed">

            <p class="reels-empty">
                Loading reels...
            </p>

        </section>

    </main>



    <!-- UPLOAD BUTTON -->

    <button
        type="button"
        class="reels-fab"
        id="reelsFab"
        title="Create reel"
    >
        ➕
    </button>



    <!-- ========================= -->
    <!-- UPLOAD MODAL -->
    <!-- ========================= -->

    <div class="reels-modal" id="reelsUploadModal">

        <div class="reels-modal-box">

            <div class="reels-modal-head">

                <h2>
                    Create Reel
                </h2>

                <button
                    type="button"
                    class="reels-modal-close"
                    data-reels-close
                >
                    ✕
                </button>

            </div>


            <div class="reels-upload-body">


                <div class="reels-dropzone" id="reelsDropzone">

                    <span class="reels-dropzone-icon">
                        🎬
                    </span>

                    <p>
                        Choose a vertical video
                    </p>

                    <small>
                        MP4 / WebM · up to 100MB
                    </small>

                </div>


                <div class="reels-preview hidden" id="reelsPreview">

                    <video
                        controls
                        muted
                        playsinline
                        id="reelsPreviewVideo"
                    ></video>

                </div>


                <div class="reels-caption-wrap">

                    <textarea
                        id="reelsCaption"
                        placeholder="Write a caption... (optional)"
                        maxlength="200"
                    ></textarea>

                </div>


                <button
                    type="button"
                    class="reels-upload-btn"
                    id="reelsUploadBtn"
                >
                    🚀 Post Reel
                </button>


            </div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- COMMENT PANEL -->
    <!-- ========================= -->

    <div class="reels-comments" id="reelsComments">

        <div class="reels-comments-head">

            <h3>
                💬 Comments
            </h3>

            <button
                type="button"
                class="reels-modal-close"
                data-reels-comments-close
            >
                ✕
            </button>

        </div>


        <div class="reels-comments-list" id="reelsCommentsList">

            <p class="reels-empty">
                No comments yet.
            </p>

        </div>


        <div class="reels-comments-input">

            <input
                type="text"
                id="reelsCommentInput"
                placeholder="Add a comment..."
                maxlength="300"
            >

            <button
                type="button"
                class="reels-comments-send"
                id="reelsCommentSend"
            >
                ➤
            </button>

        </div>

    </div>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1786741716218"></script>

    <script src="premium-ui.js?v=1786741716218"></script>

    <script src="script.js?v=1786741716218"></script>

    <script src="reels.js?v=1786741716218"></script>

</body>

</html>
