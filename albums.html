<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA - Albums</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000004">

    <link rel="stylesheet" href="dashboard.css?v=1787000000004">

    <link rel="stylesheet" href="premium.css?v=1787000000004">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000004">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION -->
    <!-- ========================= -->

    <header class="topbar">


        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search TRIYA"
            >

        </div>



        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='watch.html'"
                title="Watch"
            >
                <i class="fa-solid fa-tv"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='groups.html'"
                title="Groups"
            >
                <i class="fa-solid fa-users"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>

        </nav>



        <div class="top-icons">

            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                💬
            </button>

            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                🔔
            </button>

        </div>


    </header>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="albums-main">

        <div class="albums-head">

            <div class="albums-head-icon">
                <i class="fa-solid fa-images"></i>
            </div>

            <div>

                <h1>Albums</h1>

                <p class="albums-sub">Your photos, organized.</p>

            </div>

        </div>

        <div class="albums-top-row">

            <button
                class="socialhub-create-btn"
                onclick="socialhubAlbumsOpenCreate()"
            >
                <i class="fa-solid fa-plus"></i>
                Create Album
            </button>

        </div>

        <div
            class="albums-grid"
            id="albumsGrid"
        >

            <p class="empty-message" style="grid-column:1/-1;">
                Loading albums...
            </p>

        </div>

    </main>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1787000000004"></script>

    <script src="premium-ui.js?v=1787000000004"></script>

    <script src="albums.js?v=1787000000004"></script>

</body>

</html>
