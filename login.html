<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - TRIYA</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="auth.css?v=1786741716218">

    <link rel="stylesheet" href="premium.css?v=1786741716218">

    <link rel="stylesheet" href="glass-theme.css?v=1786741716218">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <div class="auth-container">


        <!-- BRAND -->

        <div class="brand-section">

            <div class="logo"></div>

            <h1>
                TRIYA
            </h1>

            <p>
                Connect with friends and
                share your world.
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="auth-card">

            <h2>
                Log in
            </h2>


            <form onsubmit="loginUser(event)">


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    class="login-btn"
                >
                    Log In
                </button>


            </form>


            <a
                href="#"
                class="forgot"
            >
                Forgot password?
            </a>


            <div class="divider"></div>


            <button
                class="create-btn"
                onclick="location.href='signup.html'"
            >
                Create new account
            </button>


        </div>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=1786741716218"></script>
    <script src="premium-ui.js?v=1786741716218"></script>
    <script src="script.js?v=1786741716218"></script>

</body>

</html>
