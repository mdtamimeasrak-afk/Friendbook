<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friendio - Pages</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="../core/style.css?v=1787000000036">

    <link rel="stylesheet" href="../core/dashboard.css?v=1787000000036">

    <link rel="stylesheet" href="../core/premium.css?v=1787000000036">

    <link rel="stylesheet" href="../core/glass-theme.css?v=1787000000036">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION -->
    <!-- ========================= -->

    <header class="topbar">


        <div
            class="logo"
            onclick="location.href='index.html'"
            title="Friendio"
        ></div>



        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search Friendio"
            >

        </div>



        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='watch.html'"
                title="Watch"
            >
                <i class="fa-solid fa-tv"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='groups.html'"
                title="Groups"
            >
                <i class="fa-solid fa-users"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>

        </nav>



        <div class="top-icons">

            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                💬
            </button>

            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                🔔
            </button>

        </div>


    </header>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="pages-main">

        <div class="pages-head">

            <div class="pages-head-icon">
                <i class="fa-solid fa-flag"></i>
            </div>

            <h1>Pages</h1>

        </div>

        <p class="pages-sub">Create pages and share with your followers.</p>

        <div class="pages-top-row">

            <button
                class="socialhub-create-btn"
                onclick="socialhubPagesOpenCreateModal()"
            >
                <i class="fa-solid fa-plus"></i>
                Create New Page
            </button>

            <span
                class="pages-count-pill"
                id="pagesCount"
            ></span>

        </div>

        <div
            class="pages-grid"
            id="pagesGrid"
        >

            <p class="empty-message" style="grid-column:1/-1;">
                Loading pages...
            </p>

        </div>

    </main>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../core/supabase.js?v=1787000000036"></script>

    <script src="../core/premium-ui.js?v=1787000000036"></script>

    <script src="../core/script.js?v=1787000000036"></script>

    <script src="../core/likes-comments.js?v=1787000000036"></script>

    <script src="../core/shares.js?v=1787000000036"></script>

    <script src="pages.js?v=1787000000036"></script>

</body>

</html>
