<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA - Watch</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1786708325717">

    <link rel="stylesheet" href="dashboard.css?v=1786708325717">

    <link rel="stylesheet" href="premium.css?v=1786708325717">

    <link rel="stylesheet" href="glass-theme.css?v=1786708325717">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION (home page style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO (Facebook-style "f") -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search TRIYA"
            >

        </div>



        <!-- CENTER NAV (Facebook tabs) -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>


            <button
                class="fb-nav-btn active"
                onclick="location.href='watch.html'"
                title="Watch"
            >
                <i class="fa-solid fa-tv"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Notifications"
            >
                <i class="fa-solid fa-bell"></i>
            </button>

        </nav>



        <!-- TOP ICONS (Facebook gray circles) -->

        <div class="top-icons">


            <button
                onclick="location.href='messages.html'"
                title="Messages"
            >
                💬
            </button>


            <button
                onclick="location.href='index.html'"
                title="Notifications"
            >
                🔔
            </button>


        </div>


    </header>



    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main class="watch-main">


        <div class="watch-header">

            <h1><i class="fa-solid fa-tv"></i> Watch</h1>

            <p>All videos from your friends and the TRIYA community.</p>

            <button
                class="socialhub-create-btn"
                onclick="location.href='live.html'"
                style="background:#e41e3f;margin-top:10px;"
            >
                <i class="fa-solid fa-circle-dot"></i>
                Go Live
            </button>

        </div>

        <div
            class="watch-grid"
            id="watchGrid"
        >

            <p class="empty-message">
                Loading videos...
            </p>

        </div>


        <button
            class="watch-load-more"
            id="watchLoadMore"
            style="display:none;"
        >
            Load More Videos
        </button>


    </main>


    <!-- ========================= -->
    <!-- VIDEO PLAYER MODAL -->
    <!-- ========================= -->

    <div
        id="watchPlayer"
        class="watch-player"
        style="display:none;"
    ></div>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1786708325717"></script>

    <script src="premium-ui.js?v=1786708325717"></script>

    <script src="script.js?v=1786708325717"></script>

    <script src="likes-comments.js?v=1786708325717"></script>

    <script src="shares.js?v=1786708325717"></script>

    <script src="watch.js?v=1786708325717"></script>

</body>

</html>
