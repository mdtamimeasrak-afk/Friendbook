<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SocialHub Profile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000004">

    <link rel="stylesheet" href="dashboard.css?v=1787000000004">

    <link rel="stylesheet" href="premium.css?v=1787000000004">

    <link rel="stylesheet" href="profile.css?v=1787000000004">

    <link rel="stylesheet" href="highlights.css?v=1787000000004">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000004">

    <link rel="stylesheet" href="fb-profile.css?v=1787000000004">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body class="dark-mode">


    <!-- ========================= -->
    <!-- TOP NAVBAR (56px sticky, Facebook style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="SocialHub"
        ></div>

        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search SocialHub"
            >

        </div>


        <!-- CENTER NAV -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="socialhubOpenFriendsModal()"
                title="Community"
            >
                <i class="fa-solid fa-user-group"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='marketplace.html'"
                title="Marketplace"
            >
                <i class="fa-solid fa-store"></i>
            </button>

            <button
                class="fb-nav-btn active"
                onclick="location.href='profile.html'"
                title="Profile"
            >
                <i class="fa-solid fa-user"></i>
            </button>

        </nav>


        <!-- TOP ICONS -->

        <div class="top-icons">

            <button title="Messages">
                💬
            </button>

            <button title="Notifications">
                🔔
            </button>

            <button
                onclick="toggleDarkMode()"
                title="Dark Mode"
            >
                🌙
            </button>

            <button
                onclick="location.href='settings.html'"
                title="Settings"
            >
                ⚙️
            </button>

            <button
                onclick="location.href='profile.html'"
                class="profile-mini side-avatar"
                title="Profile"
            >
                👤
            </button>

        </div>

    </header>



    <!-- ========================= -->
    <!-- PROFILE HEADER (Step 1) -->
    <!-- ========================= -->

    <main class="profile-container">


        <section class="fb-header">


            <!-- COVER PHOTO -->
            <!-- (Edit cover photo button is added automatically
                 by setupProfileCoverUpload — menu: Upload /
                 Select from photos / Reposition / Remove) -->

            <div class="cover-photo" id="coverPhoto"></div>


            <!-- HEADER ROW (avatar + info + actions) -->

            <div class="fb-header-row">


                <!-- PROFILE PICTURE (overlaps the cover;
                     own profile gets the camera menu, handled
                     by setupProfilePhotoUpload) -->

                <div class="fb-avatar-wrap">

                    <div class="profile-photo">
                        👤
                    </div>

                </div>


                <!-- NAME + FRIENDS + BIO + DETAILS -->

                <div class="fb-header-info">


                    <h1
                        class="fb-header-name"
                        id="coverName"
                    >
                        User

                        <span
                            class="fb-name-nick"
                            id="headerNickname"
                            style="display:none"
                        ></span>
                    </h1>


                    <p
                        class="fb-friends-line"
                        id="fbFriendSummary"
                    >
                        <span>0 friends</span>
                    </p>


                    <p class="fb-header-bio profile-bio">
                        Add a bio to tell people about yourself.
                    </p>


                    <!-- USER DETAILS (only filled fields stay
                         visible — socialhubTrimInfoRow hides
                         the rest) -->

                    <div class="fb-info-row">

                        <span class="fb-info-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <span class="profile-location"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-solid fa-school"></i>
                            <span class="profile-highschool"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span class="profile-education"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-solid fa-briefcase"></i>
                            <span class="profile-work"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-solid fa-heart"></i>
                            <span class="profile-relationship"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-solid fa-globe"></i>
                            <span class="profile-website"></span>
                        </span>

                        <span class="fb-info-item">
                            <i class="fa-brands fa-instagram"></i>
                            <span class="profile-sociallinks"></span>
                        </span>

                    </div>

                </div>


                <!-- OWN PROFILE ACTION BUTTONS -->

                <div class="fb-header-actions">


                    <button
                        type="button"
                        class="fb-primary-btn"
                        onclick="socialhubOpenStoryCreator()"
                    >
                        ➕ Add to story
                    </button>


                    <button
                        type="button"
                        class="fb-ghost-btn"
                        onclick="openEditProfile()"
                    >
                        ✎ Edit profile
                    </button>


                    <div class="fb-more-wrap">

                        <button
                            type="button"
                            class="fb-square-btn"
                            title="More"
                            onclick="socialhubProfileToggleMore(event)"
                        >
                            ▾
                        </button>

                        <div
                            class="fb-more-menu"
                            style="display:none"
                        >

                            <button
                                type="button"
                                onclick="document.querySelector('.search-box input')?.focus()"
                            >
                                🔍 Search SocialHub
                            </button>

                            <button
                                type="button"
                                onclick="location.href='settings.html'"
                            >
                                ⚙️ Profile Settings
                            </button>

                            <button
                                type="button"
                                onclick="logoutUser()"
                            >
                                🚪 Logout
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ================================= -->
    <!-- EDIT PROFILE MODAL (existing system) -->
    <!-- ================================= -->

    <div
        id="editProfileModal"
        class="edit-profile-modal"
    >


        <div class="edit-profile-box">


            <!-- MODAL HEADER -->

            <div class="edit-profile-header">

                <h2>
                    Edit Profile
                </h2>


                <button
                    onclick="closeEditProfile()"
                    class="close-modal"
                >
                    ✕
                </button>

            </div>



            <!-- FORM (sidebar + panel + footer) -->

            <form
                id="editProfileForm"
            >


                <div class="edit-profile-body">


                    <!-- SIDEBAR SECTIONS -->

                    <aside class="edit-profile-sidebar">

                        <button
                            type="button"
                            class="edit-profile-section active"
                            data-section="general"
                            onclick="switchEditSection('general')"
                        >
                            <i class="fa-solid fa-user"></i>
                            General
                        </button>


                        <button
                            type="button"
                            class="edit-profile-section"
                            data-section="work"
                            onclick="switchEditSection('work')"
                        >
                            <i class="fa-solid fa-briefcase"></i>
                            Work &amp; Education
                        </button>


                        <button
                            type="button"
                            class="edit-profile-section"
                            data-section="places"
                            onclick="switchEditSection('places')"
                        >
                            <i class="fa-solid fa-location-dot"></i>
                            Places Lived
                        </button>


                        <button
                            type="button"
                            class="edit-profile-section"
                            data-section="contact"
                            onclick="switchEditSection('contact')"
                        >
                            <i class="fa-solid fa-address-book"></i>
                            Contact &amp; Basic Info
                        </button>


                        <button
                            type="button"
                            class="edit-profile-section"
                            data-section="details"
                            onclick="switchEditSection('details')"
                        >
                            <i class="fa-solid fa-star"></i>
                            Details About You
                        </button>


                        <button
                            type="button"
                            class="edit-profile-section"
                            data-section="relationship"
                            onclick="switchEditSection('relationship')"
                        >
                            <i class="fa-solid fa-heart"></i>
                            Relationship
                        </button>

                    </aside>



                    <!-- CONTENT PANELS -->

                    <div class="edit-profile-panel">


                        <!-- GENERAL -->

                        <div
                            class="edit-profile-fields active"
                            id="editSectionGeneral"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Full Name
                                </label>


                                <input
                                    type="text"
                                    id="editFullName"
                                    placeholder="Your full name"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Username
                                </label>


                                <input
                                    type="text"
                                    id="editUsername"
                                    placeholder="username"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Birthday
                                </label>


                                <input
                                    type="date"
                                    id="editBirthday"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Gender
                                </label>


                                <select
                                    id="editGender"
                                >
                                    <option value="">
                                        Select gender
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Non-binary">
                                        Non-binary
                                    </option>

                                    <option value="Prefer not to say">
                                        Prefer not to say
                                    </option>

                                </select>

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Languages
                                </label>


                                <input
                                    type="text"
                                    id="editLanguages"
                                    placeholder="e.g. Bengali, English"
                                >

                            </div>


                        </div>



                        <!-- WORK & EDUCATION -->

                        <div
                            class="edit-profile-fields"
                            id="editSectionWork"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Workplace
                                </label>


                                <input
                                    type="text"
                                    id="editWork"
                                    placeholder="Where do you work?"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    University / College
                                </label>


                                <input
                                    type="text"
                                    id="editEducation"
                                    placeholder="Where did you study?"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    High School
                                </label>


                                <input
                                    type="text"
                                    id="editHighSchool"
                                    placeholder="Where did you go to high school?"
                                >

                            </div>


                        </div>



                        <!-- PLACES LIVED -->

                        <div
                            class="edit-profile-fields"
                            id="editSectionPlaces"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Current City / Town
                                </label>


                                <input
                                    type="text"
                                    id="editLocation"
                                    placeholder="Where do you live now?"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Hometown
                                </label>


                                <input
                                    type="text"
                                    id="editHometown"
                                    placeholder="Where are you from?"
                                >

                            </div>


                        </div>



                        <!-- CONTACT & BASIC INFO -->

                        <div
                            class="edit-profile-fields"
                            id="editSectionContact"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Website
                                </label>


                                <input
                                    type="url"
                                    id="editWebsite"
                                    placeholder="https://example.com"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Email
                                </label>


                                <input
                                    type="email"
                                    id="editEmail"
                                    placeholder="your email"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Phone Number
                                </label>


                                <input
                                    type="tel"
                                    id="editPhone"
                                    placeholder="+880..."
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Other Social Links
                                </label>


                                <input
                                    type="text"
                                    id="editSocialLinks"
                                    placeholder="https://instagram.com/..."
                                >

                            </div>


                        </div>



                        <!-- DETAILS ABOUT YOU -->

                        <div
                            class="edit-profile-fields"
                            id="editSectionDetails"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Bio
                                </label>


                                <textarea
                                    id="editBio"
                                    placeholder="Tell people about yourself..."
                                    rows="3"
                                ></textarea>

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Other Names
                                </label>


                                <input
                                    type="text"
                                    id="editOtherNames"
                                    placeholder="Nicknames, preferred names"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Hobbies
                                </label>


                                <input
                                    type="text"
                                    id="editHobbies"
                                    placeholder="e.g. Photography, Gaming"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Sports
                                </label>


                                <input
                                    type="text"
                                    id="editSports"
                                    placeholder="e.g. Football, Cricket"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Teams
                                </label>


                                <input
                                    type="text"
                                    id="editTeams"
                                    placeholder="e.g. FC Barcelona"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Athletes
                                </label>


                                <input
                                    type="text"
                                    id="editAthletes"
                                    placeholder="e.g. Lionel Messi"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Artists
                                </label>


                                <input
                                    type="text"
                                    id="editArtists"
                                    placeholder="e.g. Coldplay"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite TV Shows
                                </label>


                                <input
                                    type="text"
                                    id="editTvShows"
                                    placeholder="e.g. Friends"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Movies
                                </label>


                                <input
                                    type="text"
                                    id="editMovies"
                                    placeholder="e.g. Inception"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Games
                                </label>


                                <input
                                    type="text"
                                    id="editGames"
                                    placeholder="e.g. Free Fire, PUBG"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Favorite Quotes
                                </label>


                                <textarea
                                    id="editQuotes"
                                    placeholder="A quote you love..."
                                    rows="2"
                                ></textarea>

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Religious Views
                                </label>


                                <input
                                    type="text"
                                    id="editReligion"
                                    placeholder="e.g. Islam"
                                >

                            </div>


                            <div class="edit-profile-field">

                                <label>
                                    Political Views
                                </label>


                                <input
                                    type="text"
                                    id="editPolitics"
                                    placeholder="e.g. Moderate"
                                >

                            </div>


                        </div>



                        <!-- RELATIONSHIP -->

                        <div
                            class="edit-profile-fields"
                            id="editSectionRelationship"
                        >


                            <div class="edit-profile-field">

                                <label>
                                    Relationship Status
                                </label>


                                <select
                                    id="editRelationship"
                                >
                                    <option value="">
                                        Select status
                                    </option>

                                    <option value="Single">
                                        Single
                                    </option>

                                    <option value="In a relationship">
                                        In a relationship
                                    </option>

                                    <option value="Engaged">
                                        Engaged
                                    </option>

                                    <option value="Married">
                                        Married
                                    </option>

                                    <option value="It's complicated">
                                        It's complicated
                                    </option>

                                    <option value="In an open relationship">
                                        In an open relationship
                                    </option>

                                    <option value="Divorced">
                                        Divorced
                                    </option>

                                    <option value="Widowed">
                                        Widowed
                                    </option>

                                </select>

                            </div>


                        </div>


                    </div>


                </div>



                <!-- FOOTER ACTIONS -->

                <div class="edit-profile-actions">

                    <button
                        type="button"
                        onclick="closeEditProfile()"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save
                    </button>

                </div>


            </form>


        </div>

    </div>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1787000000004"></script>

    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <script src="premium-ui.js?v=1787000000004"></script>

    <script src="script.js?v=1787000000004"></script>

    <script src="image-upload.js?v=1787000000004"></script>

    <script src="post-manage.js?v=1787000000004"></script>

    <script src="friends.js?v=1787000000004"></script>

    <script src="likes-comments.js?v=1787000000004"></script>

    <script src="shares.js?v=1787000000004"></script>

    <script src="profile-page.js?v=1787000000004"></script>

    <script src="user-search.js?v=1787000000004"></script>

    <script src="notifications.js?v=1787000000004"></script>

    <script src="settings.js?v=1787000000004"></script>

    <script src="messages.js?v=1787000000004"></script>

    <script src="stories.js?v=1787000000004"></script>

    <script src="watch.js?v=1787000000004"></script>

    <script src="highlights.js?v=1787000000004"></script>


</body>

</html>
