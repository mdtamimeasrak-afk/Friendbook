<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA Profile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1787000000005">

    <link rel="stylesheet" href="dashboard.css?v=1787000000005">

    <link rel="stylesheet" href="premium.css?v=1787000000005">

    <link rel="stylesheet" href="profile.css?v=1787000000005">

    <link rel="stylesheet" href="glass-theme.css?v=1787000000005">

    <link rel="stylesheet" href="fb-profile.css?v=1787000000005">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body class="dark-mode">


    <!-- ========================= -->
    <!-- TOP NAVIGATION (home page style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO (Facebook-style "f") -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search Facebook"
            >

        </div>



        <!-- CENTER NAV (Facebook tabs) -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="socialhubOpenFriendsModal()"
                title="Friends"
            >
                <i class="fa-solid fa-user-group"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="document.querySelector('.top-icons button[title=&quot;Notifications&quot;]')?.click()"
                title="Notifications"
            >
                <i class="fa-solid fa-bell"></i>
            </button>

        </nav>



        <!-- TOP ICONS (Facebook gray circles) -->

        <div class="top-icons">


            <button
                title="Messages"
            >
                💬
            </button>


            <button
                title="Notifications"
            >
                🔔
            </button>


            <button
                onclick="toggleDarkMode()"
                title="Dark Mode"
            >
                🌙
            </button>


            <button
                onclick="location.href='settings.html'"
                title="Settings"
            >
                ⚙️
            </button>


            <button
                onclick="location.href='profile.html'"
                class="profile-mini side-avatar"
                title="Profile"
            >
                👤
            </button>


        </div>

    </header>



    <!-- ========================= -->
    <!-- PROFILE CONTAINER -->
    <!-- ========================= -->

    <main class="profile-container">


        <!-- ========================= -->
        <!-- ========================= -->

        <section class="fb-header">


            <!-- COVER PHOTO -->

            <div class="cover-photo" id="upCover"></div>



            <!-- HEADER ROW (avatar + info + actions) -->

            <div class="fb-header-row">


                <!-- AVATAR (overlaps the cover) -->

                <div class="fb-avatar-wrap">

                    <div
                        class="profile-photo"
                        id="upPhoto"
                    >
                        👤
                    </div>

                </div>



                <!-- NAME + FRIENDS + BIO + DETAILS -->

                <div class="fb-header-info">

                    <h1
                        class="fb-header-name"
                        id="upName"
                    >
                        User
                    </h1>


                    <p
                        class="fb-friends-line"
                        id="upFriendsLine"
                    >
                        <span id="upFriendsCount">0 friends</span>
                    </p>


                    <p
                        class="fb-header-bio"
                        id="upBio"
                    >
                        No bio added yet.
                    </p>


                    <div class="fb-info-row">

                        <span class="fb-info-item">
                            📍
                            <span id="upLocation"></span>
                        </span>

                        <span class="fb-info-item">
                            💼
                            <span id="upWork"></span>
                        </span>

                        <span class="fb-info-item">
                            🎓
                            <span id="upEducation"></span>
                        </span>

                        <span class="fb-info-item">
                            🌐
                            <span id="upWebsite"></span>
                        </span>

                    </div>

                </div>



                <!-- ACTION BUTTONS (friend state + Message + More) -->

                <div class="fb-header-actions">

                    <div id="upFriendButton"></div>

                    <div
                        class="fb-more-wrap"
                        id="upMoreWrap"
                        style="display:none"
                    >

                        <button
                            type="button"
                            class="fb-square-btn"
                            title="More"
                            onclick="socialhubUpToggleMore(event)"
                        >
                            ▾
                        </button>

                        <div
                            class="fb-more-menu"
                            id="upMoreMenu"
                            style="display:none"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- DIVIDER -->

            <div class="fb-header-divider"></div>

        </section>



        <!-- ========================= -->
        <!-- PROFILE CONTENT -->
        <!-- ========================= -->

        <div class="fb-body">

            <section class="fb-main">

                <div class="fb-area">



            <!-- ========================= -->
            <!-- POSTS (Instagram grid) -->
            <!-- ========================= -->

            <section class="profile-card" id="profilePostsSection">

                <div class="up-posts-tabs">

                    <button
                        class="up-posts-tab active"
                        data-up-tab="all"
                        onclick="socialhubSwitchUpTab('all')"
                    >
                        🗂️ All Posts
                    </button>

                    <button
                        class="up-posts-tab"
                        data-up-tab="videos"
                        onclick="socialhubSwitchUpTab('videos')"
                    >
                        🎥 Videos
                    </button>

                </div>


                <div
                    id="upPosts"
                    class="profile-posts-grid"
                >

                    <p class="empty-message">
                        Loading posts...
                    </p>

                </div>


            </section>



                </div>

            </section>

        </div>


    </main>



    <!-- ================================= -->
    <!-- POST LIGHTBOX (Instagram-style viewer) -->
    <!-- ================================= -->

    <div
        id="upPostLightbox"
        class="post-lightbox"
        onclick="socialhubCloseUpPostLightbox(event)"
    >


        <div class="post-lightbox-box" id="upPostLightboxBox">

        </div>

    </div>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1787000000005"></script>

    <script src="premium-ui.js?v=1787000000005"></script>

    <script src="script.js?v=1787000000005"></script>

    <script src="settings.js?v=1787000000005"></script>

    <script src="friends.js?v=1787000000005"></script>

    <script src="likes-comments.js?v=1787000000005"></script>

    <script src="user-search.js?v=1787000000005"></script>

    <script src="post-manage.js?v=1787000000005"></script>

    <script src="notifications.js?v=1787000000005"></script>

    <script src="messages.js?v=1787000000005"></script>

    <script src="shares.js?v=1787000000005"></script>

    <script src="watch.js?v=1787000000005"></script>


</body>

</html>
