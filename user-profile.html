<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRIYA Profile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231877f2'/%3E%3Ctext x='20' y='27' font-family='Arial' font-size='21' font-weight='800' fill='white' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">


    <link rel="stylesheet" href="style.css?v=1786736965929">

    <link rel="stylesheet" href="dashboard.css?v=1786736965929">

    <link rel="stylesheet" href="premium.css?v=1786736965929">

    <link rel="stylesheet" href="profile.css?v=1786736965929">

    <link rel="stylesheet" href="glass-theme.css?v=1786736965929">

    <link rel="stylesheet" href="fb-profile.css?v=1786736965929">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://vtazrwksizpeyezwctko.supabase.co">
</head>


<body>


    <!-- ========================= -->
    <!-- TOP NAVIGATION (home page style) -->
    <!-- ========================= -->

    <header class="topbar">


        <!-- LOGO (Facebook-style "f") -->

        <div
            class="logo"
            onclick="location.href='index.html'"
            title="TRIYA"
        ></div>



        <!-- SEARCH -->

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                type="text"
                placeholder="Search Facebook"
            >

        </div>



        <!-- CENTER NAV (Facebook tabs) -->

        <nav class="fb-center-nav">

            <button
                class="fb-nav-btn"
                onclick="location.href='index.html'"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </button>

            <button
                class="fb-nav-btn"
                onclick="location.href='reels.html'"
                title="Reels"
            >
                <i class="fa-solid fa-clapperboard"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="socialhubOpenFriendsModal()"
                title="Friends"
            >
                <i class="fa-solid fa-user-group"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="location.href='messages.html'"
                title="Messages"
            >
                <i class="fa-solid fa-comment-dots"></i>
            </button>


            <button
                class="fb-nav-btn"
                onclick="document.querySelector('.top-icons button[title=&quot;Notifications&quot;]')?.click()"
                title="Notifications"
            >
                <i class="fa-solid fa-bell"></i>
            </button>

        </nav>



        <!-- TOP ICONS (Facebook gray circles) -->

        <div class="top-icons">


            <button
                title="Messages"
            >
                💬
            </button>


            <button
                title="Notifications"
            >
                🔔
            </button>


            <button
                onclick="toggleDarkMode()"
                title="Dark Mode"
            >
                🌙
            </button>


            <button
                onclick="location.href='settings.html'"
                title="Settings"
            >
                ⚙️
            </button>


            <button
                onclick="location.href='profile.html'"
                class="profile-mini side-avatar"
                title="Profile"
            >
                👤
            </button>


        </div>

    </header>



    <!-- ========================= -->
    <!-- PROFILE CONTAINER -->
    <!-- ========================= -->

    <main class="profile-container">


        <!-- ========================= -->
        <!-- PROFILE HEADER (Instagram style) -->
        <!-- ========================= -->

        <section class="profile-header">


            <!-- COVER PHOTO (hidden in Instagram mode) -->

            <div class="cover-photo fb-user-cover">

                <div
                    class="fb-cover-name"
                    id="upCoverName"
                >
                    <h1
                        class="fb-cover-name-h"
                        id="upCoverNameText"
                    >
                        User
                    </h1>

                    <span
                        class="fb-cover-username"
                        id="upCoverUsername"
                    >
                        @username
                    </span>

                </div>

            </div>



            <!-- PROFILE TOP -->

            <div class="profile-top">


                <!-- PROFILE PHOTO (Instagram ring) -->

                <div
                    class="profile-photo"
                    id="upPhoto"
                >
                    👤
                </div>



                <!-- TOP RIGHT -->

                <div class="profile-top-right">


                    <!-- USERNAME + FRIEND BUTTONS -->

                    <div class="profile-identity">

                        <h1
                            class="profile-username"
                            id="upUsername"
                        >
                            @username
                        </h1>


                        <div
                            class="profile-buttons"
                            id="upFriendButton"
                        ></div>


                        <!-- MORE (⋯) MENU -->

                        <div
                            class="fb-more-wrap"
                            id="upMoreWrap"
                            style="display:none"
                        >

                            <button
                                class="fb-more-btn"
                                title="More"
                                onclick="socialhubUpToggleMore(event)"
                            >
                                ⋯
                            </button>

                            <div
                                class="fb-more-menu"
                                id="upMoreMenu"
                                style="display:none"
                            ></div>

                        </div>

                    </div>



                    <!-- STATS -->

                    <div class="profile-stats">


                        <div class="profile-stat">
                            <span id="upStatPosts">0</span>
                            <label>Posts</label>
                        </div>


                        <div class="profile-stat">
                            <span id="upStatFriends">0</span>
                            <label>Friends</label>
                        </div>


                    </div>



                    <!-- BIO (name + bio) -->

                    <div class="profile-bio-block">

                        <strong
                            class="profile-name"
                            id="upName"
                        >
                            User
                        </strong>


                        <small
                            class="profile-mutual"
                            id="upMutual"
                            style="
                                display: none;
                                color: var(--muted, #65676b);
                                font-size: 13px;
                            "
                        ></small>


                        <p
                            class="profile-bio"
                            id="upBio"
                        >
                            No bio added yet.
                        </p>

                    </div>


                </div>


            </div>

        </section>



        <!-- ========================= -->
        <!-- PROFILE CONTENT -->
        <!-- ========================= -->

        <div class="profile-content">


            <!-- ========================= -->
            <!-- POSTS (Instagram grid) -->
            <!-- ========================= -->

            <section class="profile-card" id="profilePostsSection">

                <div class="up-posts-tabs">

                    <button
                        class="up-posts-tab active"
                        data-up-tab="all"
                        onclick="socialhubSwitchUpTab('all')"
                    >
                        🗂️ All Posts
                    </button>

                    <button
                        class="up-posts-tab"
                        data-up-tab="videos"
                        onclick="socialhubSwitchUpTab('videos')"
                    >
                        🎥 Videos
                    </button>

                </div>


                <div
                    id="upPosts"
                    class="profile-posts-grid"
                >

                    <p class="empty-message">
                        Loading posts...
                    </p>

                </div>


            </section>



            <!-- ========================= -->
            <!-- INTRO -->
            <!-- ========================= -->

            <section class="profile-card">


                <div class="card-title">

                    <h2>
                        Intro
                    </h2>

                </div>


                <div class="profile-details-list">


                    <p>
                        📍
                        <span id="upLocation">
                            Not added
                        </span>
                    </p>


                    <p>
                        💼
                        <span id="upWork">
                            Not added
                        </span>
                    </p>


                    <p>
                        🎓
                        <span id="upEducation">
                            Not added
                        </span>
                    </p>


                    <p>
                        🌐
                        <span id="upWebsite">
                            Not added
                        </span>
                    </p>


                </div>


            </section>


        </div>

    </main>



    <!-- ================================= -->
    <!-- POST LIGHTBOX (Instagram-style viewer) -->
    <!-- ================================= -->

    <div
        id="upPostLightbox"
        class="post-lightbox"
        onclick="socialhubCloseUpPostLightbox(event)"
    >


        <div class="post-lightbox-box" id="upPostLightboxBox">

        </div>

    </div>



    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js?v=1786736965929"></script>

    <script src="premium-ui.js?v=1786736965929"></script>

    <script src="script.js?v=1786736965929"></script>

    <script src="settings.js?v=1786736965929"></script>

    <script src="friends.js?v=1786736965929"></script>

    <script src="likes-comments.js?v=1786736965929"></script>

    <script src="user-search.js?v=1786736965929"></script>

    <script src="post-manage.js?v=1786736965929"></script>

    <script src="notifications.js?v=1786736965929"></script>

    <script src="messages.js?v=1786736965929"></script>

    <script src="shares.js?v=1786736965929"></script>

    <script src="watch.js?v=1786736965929"></script>


</body>

</html>
