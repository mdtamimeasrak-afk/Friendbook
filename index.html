/* ------------------------------------------
   Render Emoji
   ------------------------------------------ */

function renderEmojis(
    category = "smileys",
    search = ""
) {

    emojiGrid.innerHTML = "";

    let emojis = [];

    if (search.trim() !== "") {

        Object.values(emojiData)
            .forEach(list => {

                emojis.push(
                    ...list
                );

            });

    } else {

        emojis =
            emojiData[category] ||
            emojiData.smileys;

    }


    /* Remove duplicates */

    emojis =
        [...new Set(emojis)];


    emojis.forEach(
        emoji => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "emoji-item";

            button.textContent =
                emoji;

            button.title =
                emoji;


            button.addEventListener(
                "click",
                () => {

                    insertEmoji(
                        emoji
                    );

                }
            );


            emojiGrid.appendChild(
                button
            );

        }
    );

}


/* ------------------------------------------
   Insert Emoji at Cursor
   ------------------------------------------ */

function insertEmoji(emoji) {

    const start =
        input.selectionStart ??
        input.value.length;

    const end =
        input.selectionEnd ??
        input.value.length;

    const before =
        input.value.substring(
            0,
            start
        );

    const after =
        input.value.substring(
            end
        );

    input.value =
        before +
        emoji +
        after;

    const newPosition =
        start +
        emoji.length;

    input.focus();

    input.setSelectionRange(
        newPosition,
        newPosition
    );

}

            emojiSearch.focus();

        }

    }
);


/* ------------------------------------------
   Close Picker
   ------------------------------------------ */

emojiClose.addEventListener(
    "click",
    () => {

        emojiPicker.classList.remove(
            "active"
        );

    }
);


/* ------------------------------------------
   Click Outside
   ------------------------------------------ */

document.addEventListener(
    "click",
    event => {

        if (
            !emojiPicker.contains(
                event.target
            ) &&
            event.target !== emojiButton
        ) {

            emojiPicker.classList.remove(
                "active"
            );

        }

    }
);


/* ------------------------------------------
   Initial Emoji List
   ------------------------------------------ */

const firstCategory =
    emojiPicker.querySelector(
        '.emoji-categories button[data-category="smileys"]'
    );

if (firstCategory) {

    firstCategory.classList.add(
        "active"
    );

}

renderEmojis(
    "smileys"
);


    /* ------------------------------------------
       Input styling
       ------------------------------------------ */

    input.style.transition =
        "all .25s ease";

    input.style.padding =
        "14px 16px";

    input.style.borderRadius =
        "14px";


    console.log(
        "✨ Premium SocialHub composer activated!"
    );

});

</script>
